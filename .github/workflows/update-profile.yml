name: Refresh animated GitHub profile

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '21 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card-refresh
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG font tooling
        run: |
          python -m pip install 'fonttools>=4.55,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-lato fonts-noto-core

      - name: Fetch real contributions and build animated SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_readme_cards.py --refresh

      - name: Verify all generated SVG files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cards = sorted(Path('cards').glob('*.svg'))
          assert len(cards) == 10, f'Expected 10 cards, got {len(cards)}'
          for p in cards:
              ET.parse(p)
              assert 'data:font/woff;base64,' in p.read_text()
          print(f'Validated {len(cards)} self-contained SVG cards')
          PY

      - name: Commit daily data and card assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json cards/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub profile artwork [skip ci]'
            git push
          fi
